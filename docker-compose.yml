services:
  geosentinel:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: geosentinel-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - APP_PORT=8000
      - AWS_USE_ANONYMOUS=true
      - AWS_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
